[project]
name = "colab-remote-control-mcp"
version = "0.1.0"
description = "MCP server that lets external AI agents control Google Colab via an ngrok tunnel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rashid" }
]
keywords = ["mcp", "google-colab", "agent", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.350",
    "ruff>=0.3.0",
]

[project.scripts]
colab-remote-control = "server:mcp.run"
