# Auto-build APKs for apps & games
# Copies APK to apks/ folder so Vercel serves it on the site

name: Build APKs

on:
  push:
    branches: [main]
    paths:
      - 'apps/*/index.html'
      - 'apps/*/js/**'
      - 'apps/*/css/**'
      - 'games/*/index.html'
      - 'games/*/js/**'
      - 'games/*/css/**'
      - 'games/kingcraft-game/src/**'
      - 'games/kingcraft-game/js/**'
      - 'scripts/**'
      # Site build tooling: does not affect APK contents.
      - '!scripts/check-url-surface.mjs'
      - '!scripts/site-templates.mjs'
  workflow_dispatch:
    inputs:
      forceAll:
        description: 'Build APKs for ALL projects'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  detect:
    name: Detect Changed Projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.detect.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        run: |
          ALL='["apps/calculator-app","apps/quiz-app","games/kingcraft-game","games/rust-game","games/farm-game"]'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.forceAll }}" == "true" ]]; then
            echo "projects=$ALL" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          PROJECTS='[]'
          for dir in apps/calculator-app apps/quiz-app games/kingcraft-game games/rust-game games/farm-game; do
            if echo "$CHANGED" | grep -q "^$dir/"; then
              PROJECTS=$(echo "$PROJECTS" | jq -c --arg d "$dir" '. + [$d]')
              echo "Changed: $dir"
            fi
          done

          if [ "$PROJECTS" = "[]" ]; then
            if echo "$CHANGED" | grep -q "^scripts/"; then
              echo "projects=$ALL" >> $GITHUB_OUTPUT
            else
              echo "projects=[]" >> $GITHUB_OUTPUT
            fi
          else
            echo "projects=$PROJECTS" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.project }}
    needs: detect
    if: ${{ fromJson(needs.detect.outputs.projects)[0] != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect.outputs.projects) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # android-actions/setup-android@v3 runs `sdkmanager tools`, a package that
      # no longer exists ("Failed to find package 'tools'"), so every build
      # died here before touching project code. ubuntu-latest already ships
      # the Android SDK, so point the environment at it instead.
      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "Android SDK not found at $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # cmdline-tools may be installed as "latest" or by version (e.g. 16.0)
          for d in "$SDK"/cmdline-tools/*/bin; do echo "$d" >> "$GITHUB_PATH"; done
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          ls "$SDK"

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Add apksigner (build-tools) to PATH
        run: |
          BT_DIR="$ANDROID_HOME/build-tools"
          if [ ! -d "$BT_DIR" ] || [ -z "$(ls -A "$BT_DIR" 2>/dev/null)" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
          fi
          LATEST_BT=$(ls "$BT_DIR" | sort -V | tail -1)
          echo "$BT_DIR/$LATEST_BT" >> $GITHUB_PATH
          echo "build-tools on PATH: $LATEST_BT"

      - name: Extract project info
        id: info
        run: |
          FOLDER=$(basename ${{ matrix.project }})
          echo "folder=$FOLDER" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: |
          npm install 2>&1 | tail -5
          # Capacitor reads capacitor.config.ts → needs TypeScript at build time
          npm install --no-save typescript 2>&1 | tail -3

      - name: Add Android platform
        working-directory: ${{ matrix.project }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android 2>&1 | tail -5
          fi

      - name: Build web assets
        working-directory: ${{ matrix.project }}
        run: |
          if [ "${{ steps.info.outputs.folder }}" = "kingcraft-game" ]; then
            npm run build 2>&1 | tail -5
          fi
          node ../../scripts/copy-to-www.mjs .

      - name: Generate launcher icons
        working-directory: ${{ matrix.project }}
        run: |
          npm install --no-save sharp 2>&1 | tail -3 || echo "sharp install failed — icons will be skipped"
          node ../../scripts/gen-icons.mjs .

      - name: Sync Capacitor
        working-directory: ${{ matrix.project }}
        run: npx cap sync android 2>&1 | tail -10

      - name: Configure AdMob App ID
        working-directory: ${{ matrix.project }}
        run: |
          case "${{ matrix.project }}" in
            apps/calculator-app) ADMOB_APP_ID="ca-app-pub-6142754371257083~9020699769" ;;
            apps/quiz-app)       ADMOB_APP_ID="ca-app-pub-6142754371257083~1920938942" ;;
            games/farm-game)     ADMOB_APP_ID="ca-app-pub-6142754371257083~XXXXXXXXXX" ;;
            games/kingcraft-game) ADMOB_APP_ID="ca-app-pub-6142754371257083~XXXXXXXXXX" ;;
            games/rust-game)     ADMOB_APP_ID="ca-app-pub-6142754371257083~4464642549" ;;
            *) ADMOB_APP_ID="" ;;
          esac
          if [ -n "$ADMOB_APP_ID" ]; then
            STRINGS_FILE="android/app/src/main/res/values/strings.xml"
            MANIFEST="android/app/src/main/AndroidManifest.xml"
            sed -i "s#</resources>#    <string name=\"admob_app_id\">${ADMOB_APP_ID}</string>\n</resources>#" "$STRINGS_FILE"
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"@string/admob_app_id\"/>\n    </application>#" "$MANIFEST"
            echo "AdMob App ID configured: $ADMOB_APP_ID"
          else
            echo "No AdMob App ID for this project — skipping (ad-free app/game)"
          fi

      - name: Get current version
        id: version
        run: |
          VER_FILE="${{ matrix.project }}/version.json"
          if [ -f "$VER_FILE" ]; then
            VER=$(cat $VER_FILE)
            BUILD=$(echo $VER | jq -r '.buildNumber // 1')
            NEW_BUILD=$((BUILD + 1))
            VERSION=$(echo $VER | jq -r '.version')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "build=$NEW_BUILD" >> $GITHUB_OUTPUT
          else
            echo "version=1.0.0" >> $GITHUB_OUTPUT
            echo "build=1" >> $GITHUB_OUTPUT
          fi

      - name: Build APK
        working-directory: ${{ matrix.project }}
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > release-key.jks
            npx cap build android \
              --keystorepath "$PWD/release-key.jks" \
              --keystorepass "$KS_PASS" \
              --keystorealias "${KS_ALIAS:-rashid-key}" \
              --keystorealiaspass "${KS_KEY_PASS:-$KS_PASS}" \
              --androidreleasetype APK \
              --signing-type apksigner 2>&1 | tee build.log | tail -40
          else
            keytool -genkey -v \
              -keystore temp-key.jks \
              -storepass "TempPass123" \
              -alias "rashid-temp" \
              -keypass "TempPass123" \
              -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=Rashid, OU=Dev, O=RashidApps, L=City, ST=State, C=SA" \
              -noprompt 2>&1
            npx cap build android \
              --keystorepath "$PWD/temp-key.jks" \
              --keystorepass "TempPass123" \
              --keystorealias "rashid-temp" \
              --keystorealiaspass "TempPass123" \
              --androidreleasetype APK \
              --signing-type apksigner 2>&1 | tee build.log | tail -40
          fi

      - name: Build AAB (Google Play only — quran-app)
        if: matrix.project == 'apps/quran-app'
        working-directory: ${{ matrix.project }}
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            # release-key.jks was already written by the "Build APK" step above
            npx cap build android \
              --keystorepath "$PWD/release-key.jks" \
              --keystorepass "$KS_PASS" \
              --keystorealias "${KS_ALIAS:-rashid-key}" \
              --keystorealiaspass "${KS_KEY_PASS:-$KS_PASS}" \
              --androidreleasetype AAB \
              --signing-type apksigner 2>&1 | tee build-aab.log | tail -40
          else
            echo "No release keystore configured — skipping AAB build (APK-only temp-signed build already produced above)."
          fi

      - name: Upload AAB artifact (Google Play only — quran-app)
        if: matrix.project == 'apps/quran-app'
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-aab
          path: apps/quran-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Copy APK to site folder
        id: apk
        run: |
          APK_FILE=$(find ${{ matrix.project }}/android/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK_FILE" ]; then
            FOLDER="${{ steps.info.outputs.folder }}"
            VERSION="${{ steps.version.outputs.version }}"
            DEST="apks/${FOLDER}-v${VERSION}.apk"
            cp "$APK_FILE" "$DEST"
            echo "path=$DEST" >> $GITHUB_OUTPUT
            echo "APK copied to $DEST"
          else
            echo "path=" >> $GITHUB_OUTPUT
            echo "::error::No APK produced for ${{ matrix.project }} — Capacitor/Gradle build failed"
            exit 1
          fi

      - name: Verify APK is signed
        if: steps.apk.outputs.path != ''
        run: |
          if jarsigner -verify "${{ steps.apk.outputs.path }}" 2>&1 | grep -q "jar is unsigned"; then
            echo "::error::${{ steps.apk.outputs.path }} is UNSIGNED — refusing to publish it. Check the 'Build APK' step log for a signing failure (e.g. apksigner not found)."
            exit 1
          fi

      - name: Publish APK to GitHub Release
        id: publish
        if: steps.apk.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # apks/*.apk used to be committed straight to git here (see docs/APK_HOSTING.md
          # for why that was a repo-weight problem: every build added a binary that never
          # left .git history). New builds now go to a GitHub Release instead — nothing
          # binary reaches git from this workflow any more. The release is an asset bucket,
          # not a git ref, so it's safe for concurrent matrix jobs to share one tag.
          TAG="apks-latest"
          FOLDER="${{ steps.info.outputs.folder }}"
          VERSION="${{ steps.version.outputs.version }}"
          APK_PATH="${{ steps.apk.outputs.path }}"
          ASSET_NAME="${FOLDER}-v${VERSION}.apk"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "APK downloads" \
              --notes "Built and published automatically by apk-build.yml. App catalog: downloads.html." \
              || gh release view "$TAG" >/dev/null 2>&1 \
              || { echo "::error::could not create or find release $TAG"; exit 1; }
          fi

          uploaded=0
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" "$APK_PATH#$ASSET_NAME" --clobber; then
              echo "uploaded $ASSET_NAME on attempt $i"
              uploaded=1
              break
            fi
            echo "upload failed (attempt $i), retrying..."
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$uploaded" != "1" ]; then
            echo "::error::Failed to upload $ASSET_NAME to release $TAG after retries"
            exit 1
          fi

          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Update version.json with Release URL
        if: steps.apk.outputs.path != ''
        run: |
          VER_FILE="${{ matrix.project }}/version.json"
          BUILD="${{ steps.version.outputs.build }}"
          RELEASE_URL="${{ steps.publish.outputs.url }}"
          if [ -f "$VER_FILE" ]; then
            NEW_VER=$(cat $VER_FILE | jq \
              --arg url "$RELEASE_URL" \
              --argjson bld "$BUILD" \
              '.apkUrl = $url | .buildNumber = $bld')
            echo "$NEW_VER" > "$VER_FILE"
            echo "Updated version.json with Release URL"
          fi

      - name: Commit version.json
        if: steps.apk.outputs.path != ''
        run: |
          git config user.name "APK Bot"
          git config user.email "bot@rashid.app"
          git add "${{ matrix.project }}/version.json"
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "apk: ${{ steps.info.outputs.folder }} v${{ steps.version.outputs.version }} -> GitHub Release"
          # Parallel matrix jobs push concurrently — rebase & retry to avoid losing updates to a push race
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected (attempt $i), rebasing..."
            git pull --rebase --autostash origin main || true
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::Failed to push version.json after retries"
          exit 1
