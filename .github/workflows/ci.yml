# Site CI: the same build Vercel runs, plus the checks that keep it safe.
# Vercel auto-deploys main on its own; this workflow is the gate that tells
# you (and blocks a PR) when that build would be broken or leak files.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for exposed API keys
        run: |
          set -o pipefail
          KEY_PATTERN='AIza[0-9A-Za-z_-]{35}|sk-(proj|ant)-[A-Za-z0-9_-]{10,}|AKIA[0-9A-Z]{16}'
          SECRET_ASSIGN_PATTERN='(SERVICE_ROLE|SECRET)[A-Za-z_]*[[:space:]]*[:=][[:space:]]*['"'"'"]'
          MATCHES=$( { grep -rEn "$KEY_PATTERN" --include="*.js" --include="*.html" \
              --exclude-dir=node_modules --exclude-dir=.git .
            grep -rEn "$SECRET_ASSIGN_PATTERN" --include="*.js" --include="*.html" \
              --exclude-dir=node_modules --exclude-dir=.git . ; } 2>/dev/null \
            | grep -v "gemini-config.example" || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::Potential exposed secret(s) found in client-side code — see matches above"
            exit 1
          fi
          echo "No exposed API keys"

  build:
    name: Build, verify, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Syntax of all first-party JS, and no secrets or service-role key in api/.
      - run: npm run lint

      # Same command Vercel runs (vercel.json buildCommand).
      - run: npm run build

      # dist/ must equal tracked files minus the exclusion lists.
      - run: npm run verify

      # API handler unit tests + dist/ leak guard (needs the build above).
      - run: npm test

      # Fails on known high/critical advisories in the dependency tree.
      - run: npm audit --audit-level=high
