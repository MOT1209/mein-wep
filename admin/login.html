<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Admin sign-in | Rashid</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/admin/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/admin/admin-auth.css">
</head>
<body>
  <main class="auth" aria-labelledby="auth-title">
    <p class="auth-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Rashid · Admin
    </p>
    <h1 id="auth-title">Sign in</h1>
    <p class="auth-lead">Owner access only. There is no public registration.</p>

    <p class="notice" id="login-notice" role="status" aria-live="polite" hidden></p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required inputmode="email" spellcheck="false">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <div class="pw-field">
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" data-toggle-password="login-password" aria-label="Show password" aria-pressed="false">
          <svg class="icon-eye" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
    </form>

    <div class="auth-foot">
      <button type="button" class="link-btn" id="forgot-password">Forgot password?</button>
      <a href="/">Back to the site</a>
    </div>
  </main>
  <script src="/admin/js/password-toggle.js"></script>
  <script src="/admin/js/login.js"></script>
</body>
</html>
