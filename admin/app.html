<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Admin</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/admin/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/admin/app/app.css">
  <script type="module" src="/admin/app/main.js"></script>
</head>
<body>
  <a class="skip" id="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <button type="button" class="btn btn-icon menu-btn" id="menu-btn" aria-controls="nav" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <p class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 18h18l-2-11-5 5-2-7-2 7-5-5z"/></svg>
      <span id="brand">Admin</span>
    </p>
    <div class="topbar-tools">
      <a class="btn btn-ghost" id="view-site" href="/" target="_blank" rel="noopener">Site</a>
      <select id="lang-select" class="lang-select"></select>
      <button type="button" class="btn btn-icon" id="theme-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button type="button" class="btn btn-primary" id="publish-btn">Publish</button>
      <button type="button" class="btn" id="signout-btn">Sign out</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="nav"></aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <p class="who" id="who"></p>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
