<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Set a new password | Rashid Admin</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/admin/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/admin/admin-auth.css">
</head>
<body>
  <main class="auth" aria-labelledby="auth-title">
    <p class="auth-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Rashid · Admin
    </p>
    <h1 id="auth-title">Set a new password</h1>

    <p class="notice" id="reset-notice" role="status" aria-live="polite" hidden></p>

    <form id="reset-form" novalidate hidden>
      <div class="field">
        <label for="reset-password">New password</label>
        <input id="reset-password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="reset-hint">
        <span class="field-hint" id="reset-hint">At least 12 characters.</span>
      </div>
      <div class="field">
        <label for="reset-confirm">Repeat the new password</label>
        <input id="reset-confirm" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <button type="submit" class="btn btn-primary" id="reset-submit">Save password</button>
    </form>

    <div class="auth-foot">
      <a href="/admin/login.html">Back to sign-in</a>
    </div>
  </main>
  <script src="/admin/js/reset-password.js"></script>
</body>
</html>
